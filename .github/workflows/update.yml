name: Mise à jour des données
on:
  schedule:
    - cron: "30 22 * * 1-5"
  push:
    paths: ["tickers.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python update_data.py
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Mise à jour des données" || echo "Rien à enregistrer"
          git push
